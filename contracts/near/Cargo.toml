[package]
name = "plr-registry"
version = "0.1.0"
edition = "2021"
description = "PLR-v1 registry: on-chain MOCK TDX quote verification, compose/OS allowlist, receipt anchoring (SPEC §7)"
license = "MIT"
publish = false
repository = "https://github.com/erhantrk/provenexit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
sha2 = { version = "0.10.9", default-features = false }
# Only used to check that 64-byte x‖y keys are valid P-256 points before compressing them for the host.
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["contract", "std", "default-x509", "rustcrypto"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.16", features = ["custom"] }

[features]
# Test-only fixed clock for the TV-Q1 vector (collateral valid 2025-06-19..2025-07-19). NEVER deploy a build with it.
tdx-test-clock = []
# Native tests only: verify the real dstack log from spike S1 (`fixtures/phala-spike/`). Off by default so the
# build does not depend on that fixture being present.
spike-fixture = []

[dev-dependencies]
# Native test host (src/test_host.rs) implements the NEAR crypto host functions with these crates.
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "ecdsa"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "zeroize"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Reproducible build (cargo near build reproducible-wasm): anyone can rebuild the deployed wasm from this commit.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

