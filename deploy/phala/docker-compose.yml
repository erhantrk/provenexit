services:
  exit:
    image: ghcr.io/erhantrk/provenexit-exit@sha256:74c6d1c52e2ce72698fb238e52e27d03eefe1770af00a1dae3405d3474f22785
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: none
    ports:
      - "18200:18200"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      PLR_ATTESTER: dstack
      PLR_VPN_POLICY_PATH: /app/vpn-policy.json
      PLR_VPN_HOST: 0.0.0.0
      PLR_VPN_PORT: "18200"
      PLR_CHAIN: near
      PLR_NEAR_RPC: https://test.rpc.fastnear.com
      PLR_VPN_REGISTRY: vpnreg.pe-owner-erhan.testnet
      PLR_OPERATOR_ID: pe-op-erhan.testnet
      PLR_OPERATOR_KEY: ${PLR_OPERATOR_KEY}
      PLR_ANCHOR_INTERVAL_MS: "60000"
      PLR_REGISTER_DEPOSIT: "100000000000000000000000"
      PLR_PCCS_URL: https://pccs.phala.network
      PLR_VPN_ALLOWED_PORTS: "80,443"
      PLR_VPN_MAX_TUNNELS: "32"
