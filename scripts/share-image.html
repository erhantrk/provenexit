<meta charset="utf-8">
<style>

* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: "Overpass", sans-serif; color: #14132B; background: #FCFCFF;
  background-image:
    radial-gradient(620px 420px at 100% 0%, #E7E3FF 0%, rgb(231 227 255 / 0) 70%),

  background-size: auto, auto, 26px 26px;
  display: grid; grid-template-columns: 1fr 450px; gap: 40px; padding: 64px 68px; align-items: center;
}
.brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; letter-spacing: -.01em; }
.brand svg { width: 52px; height: 48px; fill: none; stroke-width: 40; stroke-linecap: round; stroke-linejoin: round; }
h1 { font-weight: 800; font-size: 70px; line-height: 1.06; letter-spacing: -.02em; margin-top: 44px; }
h1 em { font-style: normal; color: #5034E6; }
.pill { display: inline-flex; align-items: center; gap: 10px; margin-top: 40px; padding: 9px 18px 7px; border: 1.5px solid #B9AFFF; border-radius: 99px; background: #fff; color: #5034E6; font-weight: 700; font-size: 22px; }
.pill i { width: 10px; height: 10px; border-radius: 50%; background: #5034E6; margin-top: -3px; }
.plate { background: #3DDC84; border-radius: 22px; padding: 12px; box-shadow: 0 30px 70px rgb(80 52 230 / .22), 0 4px 14px rgb(20 19 43 / .08); }
.plate > div { border: 2px solid rgb(14 122 64 / .55); border-radius: 14px; padding: 40px 36px 34px; }
.word { font-weight: 800; font-size: 98px; line-height: 1; letter-spacing: -.03em; }
.line { font-size: 24px; white-space: nowrap; margin-top: 22px; }
.ticks { display: grid; grid-template-columns: repeat(20, 1fr); gap: 5px; margin-top: 64px; }
.ticks i { height: 30px; border-radius: 4px; background: #14132B; }
.foot { display: flex; gap: 20px; margin-top: 22px; font-weight: 700; font-size: 17px; white-space: nowrap; }
</style>
